<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Pinball</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d20;color:#e6edff;font:16px system-ui;text-align:center}main{max-width:460px;margin:auto;padding:16px}h1{margin:4px;font-size:27px;letter-spacing:4px;color:#59f0e1}header{display:flex;justify-content:space-between;padding:14px 0;font-weight:bold}canvas{width:100%;display:block;background:#10172e;border:2px solid #445183;border-radius:22px;box-shadow:0 0 35px #00ffe51a;touch-action:none}nav{display:flex;gap:12px;margin-top:14px}button{flex:1;padding:17px 8px;border:1px solid #536796;background:#202d50;color:white;border-radius:12px;font:bold 16px system-ui;touch-action:none;user-select:none}button:active{background:#3a576d}#start{background:#194e51}p{font-size:12px;color:#a0b1ce;line-height:1.7}#status{min-height:22px;color:#ffda80;font-size:14px}
</style><main><h1>NEON PINBALL</h1><header><span>PONTOS <b id="score">0</b></span><span>BOLAS <b id="lives">3</b></span></header><canvas width="420" height="580" aria-label="Mesa de pinball. Controle pelas setas ou botões abaixo."></canvas><nav><button id="left" aria-label="Rebatedor esquerdo">◀</button><button id="start">Lançar bola</button><button id="right" aria-label="Rebatedor direito">▶</button></nav><p id="status" role="status">Lance a bola para começar!</p><p>← → ou A / D: rebatedores · Espaço: lançar<br>No celular, segure os botões laterais. Acerte os círculos para pontuar!</p></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),statusEl=document.querySelector('#status'),start=document.querySelector('#start');
let score=0,lives=3,active=false,ball={x:365,y:475,vx:0,vy:0},keys={left:false,right:false},last=0,acc=0;
const bumpers=[{x:130,y:160,r:27},{x:290,y:160,r:27},{x:210,y:260,r:32}];
const walls=[[22,45,22,465],[398,45,398,465],[22,45,80,20],[80,20,340,20],[340,20,398,45],[22,465,100,505],[398,465,320,505]];
function sync(){scoreEl.textContent=score;livesEl.textContent=lives}
function launch(){if(active)return;if(lives===0){score=0;lives=3;sync()}ball={x:360,y:450,vx:-130,vy:-650};active=true;statusEl.textContent='Valendo!';start.textContent='Bola em jogo'}
function segment(x1,y1,x2,y2,kick=0){let dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((ball.x-x1)*dx+(ball.y-y1)*dy)/(dx*dx+dy*dy))),px=x1+t*dx,py=y1+t*dy,nx=ball.x-px,ny=ball.y-py,d=Math.hypot(nx,ny);if(d<14){if(d<.001){nx=0;ny=-1;d=1}else{nx/=d;ny/=d}ball.x=px+nx*14;ball.y=py+ny*14;let dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=1.8*dot*nx;ball.vy-=1.8*dot*ny}if(kick){ball.vy=-590;ball.vx+=(210-ball.x)*2}}}
function flippers(){return [[100,505,185,keys.left?470:530,keys.left],[320,505,235,keys.right?470:530,keys.right]]}
function update(dt){if(!active)return;ball.vy+=510*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;for(const w of walls)segment(...w);for(const f of flippers())segment(...f);for(const b of bumpers){let dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy);if(d<b.r+9){let nx=d?dx/d:0,ny=d?dy/d:-1;ball.x=b.x+nx*(b.r+9);ball.y=b.y+ny*(b.r+9);let dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.vx+=nx*95;ball.vy+=ny*95;score+=100;sync();b.flash=performance.now()+100}}}const speed=Math.hypot(ball.vx,ball.vy);if(speed>850){ball.vx*=850/speed;ball.vy*=850/speed}if(ball.y>600){active=false;lives--;sync();start.textContent=lives?'Lançar bola':'Jogar de novo';statusEl.textContent=lives?'Bola perdida. Tente outra vez!':'Fim de jogo! '+score+' pontos.'}}
function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function draw(){ctx.clearRect(0,0,420,580);ctx.fillStyle='#1b2641';for(let x=30;x<420;x+=30)for(let y=30;y<580;y+=30)ctx.fillRect(x,y,2,2);ctx.shadowBlur=10;ctx.shadowColor='#6377ff';for(const w of walls)line(...w,'#6377ff',7);for(const b of bumpers){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=performance.now()<b.flash?'#fff':'#213953';ctx.fill();ctx.strokeStyle='#5ce8db';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#5ce8db';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('+100',b.x,b.y+5)}for(const f of flippers())line(...f.slice(0,4),'#ff78b7',13);ctx.shadowBlur=0;ctx.fillStyle='#c7d0ff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('ACERTE • REBATA • REPITA',210,365);if(active||lives>0){ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,Math.PI*2);ctx.fillStyle='#fff3b0';ctx.fill()}}
function frame(t){if(!last)last=t;acc+=Math.min((t-last)/1000,.05);last=t;while(acc>=1/120){update(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}
for(const side of ['left','right']){const el=document.getElementById(side);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[side]=true;el.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>keys[side]=false)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.code==='Space'&&!e.repeat)launch()});window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});window.addEventListener('blur',()=>{keys.left=false;keys.right=false});document.addEventListener('visibilitychange',()=>{last=0;acc=0});start.addEventListener('click',launch);requestAnimationFrame(frame);
</script></html>
